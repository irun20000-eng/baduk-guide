// 수업 엔진: 차시 자료의 판 그림을 읽고, 문제의 정답을 규칙 엔진으로 계산한다.
// 화면 코드와 테스트(정답 자동 검산)가 같은 함수를 쓴다.

const STEP_TYPES = ['explain', 'free', 'explore', 'move', 'count', 'choice', 'point', 'forbidden', 'sequence', 'chase'];

// 판 그림 글자
//  .  빈 곳          X  흑돌           O  백돌
//  x  표시한 흑돌     o  표시한 백돌     (문제의 대상이 되는 돌, 세모 표시)
//  *  정답 자리(빈 곳)
//  +  활로 표시(빈 곳, 초록 점)          !  아님 표시(빈 곳, 빨간 가위표)
//  #  패 때문에 지금 둘 수 없는 자리
// 그 밖에: turn 'B' | 'W', labels [{ at, text }], captures { B, W }, komi
function parseBoard(spec) {
  const rows = spec.rows.map((r) => r.replace(/\s+/g, ''));
  const size = rows.length;
  const state = createGame(size);
  const answers = [];
  const targets = [];
  const dots = [];
  const crosses = [];
  let ko = -1;
  rows.forEach((row, y) => {
    if (row.length !== size) throw new Error('줄 길이가 판 크기와 다릅니다: "' + row + '"');
    [...row].forEach((ch, x) => {
      const i = y * size + x;
      switch (ch) {
        case '.': break;
        case 'X': state.board[i] = BLACK; break;
        case 'O': state.board[i] = WHITE; break;
        case 'x': state.board[i] = BLACK; targets.push(i); break;
        case 'o': state.board[i] = WHITE; targets.push(i); break;
        case '*': answers.push(i); break;
        case '+': dots.push(i); break;
        case '!': crosses.push(i); break;
        case '#': ko = i; break;
        default: throw new Error('판 그림에 쓸 수 없는 글자입니다: "' + ch + '"');
      }
    });
  });
  state.turn = spec.turn === 'W' ? WHITE : BLACK;
  state.ko = ko;
  if (spec.captures) state.captures = { 1: spec.captures.B || 0, 2: spec.captures.W || 0 };
  if (typeof spec.komi === 'number') state.komi = spec.komi;
  const labels = (spec.labels || []).map((l) => {
    const at = fromCoord(size, l.at);
    if (at < 0) throw new Error('이름표 좌표가 잘못되었습니다: ' + l.at);
    return { at, text: l.text };
  });
  return { size, state, answers, targets, dots, crosses, labels, ko };
}

// 귀, 변, 중앙 구분 (입문 설명용의 넉넉한 기준)
function regionOf(size, idx) {
  const band = size >= 13 ? 4 : size >= 9 ? 3 : 2;
  const x = idx % size;
  const y = (idx - x) / size;
  const nearX = x < band || x >= size - band;
  const nearY = y < band || y >= size - band;
  if (nearX && nearY) return 'corner';
  if (!nearX && !nearY) return 'center';
  return 'side';
}

function sameGroup(board, size, points) {
  if (points.length < 2) return true;
  const g = groupAt(board, size, points[0]).stones;
  return points.every((p) => g.includes(p));
}

// 한 점짜리 집이 진짜 집인지 옥집인지. 'none' | 'real' | 'false'
// 대각선 자리를 상대가 차지한 수로 판단한다 (가운데는 2곳 이상, 변과 귀는 1곳 이상이면 옥집).
function eyeKind(board, size, idx) {
  if (board[idx] !== EMPTY) return 'none';
  const near = neighbors(size, idx);
  const c = board[near[0]];
  if (c === EMPTY || !near.every((n) => board[n] === c)) return 'none';
  const x = idx % size;
  const y = (idx - x) / size;
  let bad = 0;
  let off = 0;
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const nx = x + dx;
    const ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= size || ny >= size) { off++; continue; }
    const d = board[ny * size + nx];
    if (d !== EMPTY && d !== c) bad++;
  }
  return (off > 0 ? bad >= 1 : bad >= 2) ? 'false' : 'real';
}

// ---- 몰아 잡기 (축, 환격, 촉촉수): 단수를 계속 쳐서 잡을 수 있는지 ----

// 쫓기는 쪽이 둘 만한 수: 자기 활로 자리, 그리고 단수 된 둘레의 상대 돌을 따내는 자리
function defenderMoves(state, target) {
  const { board, size } = state;
  const g = groupAt(board, size, target);
  const out = new Set(g.liberties);
  for (const s of g.stones) {
    for (const n of neighbors(size, s)) {
      if (board[n] !== EMPTY && board[n] !== g.color) {
        const a = groupAt(board, size, n);
        if (a.liberties.length === 1) out.add(a.liberties[0]);
      }
    }
  }
  return [...out];
}

// 이 수를 두면 끝까지 몰아서 잡을 수 있는가 (둘 차례 = 잡는 쪽)
function chaseMoveWins(state, target, move, depth = 30) {
  const r = play(state, move);
  if (!r.ok) return false;
  const after = r.state;
  if (after.board[target] === EMPTY) return true;
  if (groupAt(after.board, after.size, target).liberties.length !== 1) return false;
  if (depth <= 0) return false;
  for (const d of defenderMoves(after, target)) {
    const rr = play(after, d);
    if (!rr.ok) continue;
    if (!chaseWins(rr.state, target, depth - 1)) return false;
  }
  return true;
}

function chaseWinningMoves(state, target, depth = 30) {
  const g = groupAt(state.board, state.size, target);
  if (g.color === EMPTY || g.liberties.length > 2) return [];
  return g.liberties.filter((m) => chaseMoveWins(state, target, m, depth));
}

function chaseWins(state, target, depth = 30) {
  if (state.board[target] === EMPTY) return true;
  return chaseWinningMoves(state, target, depth).length > 0;
}

// 쫓기는 쪽의 응수 (화면에서 상대가 두는 수). 따낼 수 있으면 따내고, 아니면 활로가 가장 늘어나는 쪽으로 달아난다. 없으면 -1.
function chaseReply(state, target) {
  let best = -1;
  let top = -1;
  for (const d of defenderMoves(state, target)) {
    const r = play(state, d);
    if (!r.ok) continue;
    const v = groupAt(r.state.board, state.size, target).liberties.length + (r.captured.length ? 0.5 : 0);
    if (v > top) { top = v; best = d; }
  }
  return best;
}

// 정답 수와 응수를 번갈아 두어 끝까지 가 본다.
function chasePlayout(state, target) {
  let s = state;
  let myMoves = 0;
  while (myMoves < 40) {
    const wins = chaseWinningMoves(s, target);
    if (wins.length === 0) return { captured: false, myMoves };
    s = play(s, wins[0]).state;
    myMoves++;
    if (s.board[target] === EMPTY) return { captured: true, myMoves };
    const reply = chaseReply(s, target);
    s = reply >= 0 ? play(s, reply).state : pass(s);
  }
  return { captured: false, myMoves };
}

// ---- 사활: 둘러싸인 돌이 살 수 있는지 작은 범위에서 끝까지 읽는다 ----

// 대상 돌에서 빈 점과 같은 색 돌을 따라 닿는 범위 (집 모양의 안쪽)
function insideRegion(state, target) {
  const { board, size } = state;
  const color = board[target];
  const seen = new Set([target]);
  const stack = [target];
  while (stack.length) {
    const cur = stack.pop();
    for (const n of neighbors(size, cur)) {
      if (!seen.has(n) && (board[n] === EMPTY || board[n] === color)) {
        seen.add(n);
        stack.push(n);
      }
    }
  }
  return [...seen];
}

// 둘 차례(state.turn)부터 서로 가장 좋은 수를 둘 때 대상 돌이 잡히지 않으면 true.
// 수는 안쪽 범위에만 둔다. 둘 다 쉬면 산 것으로 본다.
function survives(state, target, maxDepth = 24) {
  const defender = state.board[target];
  if (defender === EMPTY) return false;
  const memo = new Map();
  const go = (s, region, depth) => {
    if (s.board[target] === EMPTY) return false;
    if (s.passes >= 2 || depth <= 0) return true;
    const key = s.board.join('') + '|' + s.turn + '|' + s.ko + '|' + s.passes + '|' + region.size;
    if (memo.has(key)) return memo.get(key);
    memo.set(key, true); // 같은 모양이 되풀이되면 잡지 못한 것으로 본다
    const isDef = s.turn === defender;
    let result = !isDef;
    const kids = [];
    for (const p of region) {
      if (s.board[p] !== EMPTY) continue;
      const r = play(s, p);
      if (r.ok) kids.push([r.state, r.captured.length ? new Set([...region, ...r.captured]) : region]);
    }
    kids.push([pass(s), region]);
    for (const [k, reg] of kids) {
      const alive = go(k, reg, depth - 1);
      if (isDef && alive) { result = true; break; }
      if (!isDef && !alive) { result = false; break; }
    }
    memo.set(key, result);
    return result;
  };
  return go({ ...state, passes: 0 }, new Set(insideRegion(state, target)), maxDepth);
}

// ---- 한 수 문제 ----
// 조건을 만족하는 수를 모두 찾는다. 자료에 적은 정답과 같은지 검산할 때 쓴다.
//  capture       상대 돌을 따낸다
//  atari         표시한 상대 돌이 단수가 된다 (내가 둔 돌은 바로 단수가 아니다)
//  double-atari  상대 덩어리 둘 이상이 한꺼번에 단수가 된다
//  escape        표시한 내 돌의 활로가 2개 이상이 된다
//  cut           상대가 두면 표시한 돌들이 이어지는 자리를 내가 차지한다
//  connect       표시한 내 돌들이 한 덩어리가 된다
//  chase         단수를 계속 쳐서 표시한 상대 돌을 끝내 잡는 첫 수 (축, 환격, 촉촉수)
//  net           표시한 상대 돌이 어디로 달아나도 잡히게 가두는 수 (장문)
//  race          수상전: 상대 돌의 바깥 활로를 메운다 (서로 같이 쓰는 활로는 아니다)
//  close         집의 빈틈을 막아 내 집이 가장 많아지는 수
//  live          표시한 내 돌을 살리는 수 (상대가 어떻게 두어도 잡히지 않는다)
//  kill          표시한 상대 돌을 잡는 수 (상대가 어떻게 두어도 살지 못한다)
function movesFor(check, state, targets) {
  const { size, board } = state;
  const me = state.turn;
  const foe = opponent(me);
  const mine = targets.filter((t) => board[t] === me);
  const theirs = targets.filter((t) => board[t] === foe);
  let inside = null;
  if (check === 'live') inside = new Set(insideRegion(state, mine[0]));
  if (check === 'kill') inside = new Set(insideRegion(state, theirs[0]));
  if (check === 'close') {
    // 집의 빈틈 막기: 두고 나서 내 집이 가장 많아지는 수 (지금보다 늘어야 한다)
    const now = score(state).territory[me];
    let top = now;
    let best = [];
    for (let i = 0; i < board.length; i++) {
      if (board[i] !== EMPTY) continue;
      const r = play(state, i);
      if (!r.ok) continue;
      const v = score(r.state).territory[me];
      if (v > top) { top = v; best = [i]; } else if (v === top && v > now) best.push(i);
    }
    return best;
  }
  const out = [];
  for (let i = 0; i < board.length; i++) {
    if (board[i] !== EMPTY) continue;
    if (inside && !inside.has(i)) continue;
    const r = play(state, i);
    if (!r.ok) continue;
    const after = r.state.board;
    const ownLibs = groupAt(after, size, i).liberties.length;
    let ok = false;
    if (check === 'capture') {
      ok = r.captured.length > 0;
    } else if (check === 'atari') {
      const t = targets[0];
      ok = after[t] !== EMPTY && groupAt(after, size, t).liberties.length === 1 && ownLibs >= 2;
    } else if (check === 'double-atari') {
      ok = ownLibs >= 2 && groupsInAtari(r.state).filter((g) => g.color === foe).length >= 2;
    } else if (check === 'escape') {
      const t = targets[0];
      ok = after[t] === me && groupAt(after, size, t).liberties.length >= 2;
    } else if (check === 'cut') {
      const f = play({ ...state, turn: foe }, i);
      ok = f.ok && !sameGroup(board, size, targets) && sameGroup(f.state.board, size, targets) && ownLibs >= 2;
    } else if (check === 'connect') {
      ok = !sameGroup(board, size, targets) && sameGroup(after, size, targets);
    } else if (check === 'chase') {
      ok = chaseMoveWins(state, theirs[0], i);
    } else if (check === 'net') {
      const t = theirs[0];
      ok = after[t] !== EMPTY && groupAt(after, size, t).liberties.length >= 2 &&
        !groupAt(board, size, t).liberties.includes(i) &&
        [...defenderMoves(r.state, t), -1].every((d) => {
          if (d < 0) return chaseWins(pass(r.state), t);
          const rr = play(r.state, d);
          return !rr.ok || chaseWins(rr.state, t);
        });
    } else if (check === 'race') {
      ok = groupAt(board, size, theirs[0]).liberties.includes(i) && !groupAt(board, size, mine[0]).liberties.includes(i) &&
        (ownLibs >= 2 || r.captured.length > 0);
    } else if (check === 'live') {
      ok = survives(r.state, mine[0]);
    } else if (check === 'kill') {
      ok = after[theirs[0]] === EMPTY || !survives(r.state, theirs[0]);
    } else {
      throw new Error('모르는 조건입니다: ' + check);
    }
    if (ok) out.push(i);
  }
  return out;
}

// "짚기 문제"의 정답 묶음. 묶음 하나는 점들의 배열이고, 그 안의 아무 점이나 누르면 그 묶음을 찾은 것이다.
function pointTargets(step, parsed) {
  const { size, state } = parsed;
  const all = [...state.board.keys()];
  const empties = all.filter((i) => state.board[i] === EMPTY);
  switch (step.rule) {
    case 'corner':
    case 'side':
    case 'center':
      return [all.filter((i) => regionOf(size, i) === step.rule)];
    case 'star':
      return [starPoints(size).map(([x, y]) => y * size + x)];
    case 'atari':
      return groupsInAtari(state).map((g) => g.stones);
    case 'illegal':
      return empties.filter((i) => play(state, i).reason === 'suicide').map((i) => [i]);
    case 'false-eye':
      return empties.filter((i) => eyeKind(state.board, size, i) === 'false').map((i) => [i]);
    case 'real-eye':
      return empties.filter((i) => eyeKind(state.board, size, i) === 'real').map((i) => [i]);
    case 'neutral':
      return score(state).neutral.map((i) => [i]);
    default: {
      const stones = parsed.targets.map((t) => groupAt(state.board, size, t).stones);
      return [...stones, ...parsed.answers.map((a) => [a])];
    }
  }
}

// 수 세기 문제의 실제 값
function countFor(step, parsed) {
  if (step.check === 'liberties') return groupAt(parsed.state.board, parsed.size, parsed.targets[0]).liberties.length;
  if (step.check === 'stones') return groupAt(parsed.state.board, parsed.size, parsed.targets[0]).stones.length;
  if (step.check === 'territory') return score(parsed.state).territory[step.color === 'W' ? WHITE : BLACK];
  if (step.check === 'stonesB') return parsed.state.board.filter((c) => c === BLACK).length;
  if (step.check === 'total') {
    const s = score(parsed.state);
    return step.color === 'W' ? s.white : s.black;
  }
  return null;
}

// 고르기 문제 가운데 규칙으로 답을 계산할 수 있는 것. 계산할 수 없으면 null, 있으면 정답 번호.
function choiceFor(step, parsed) {
  const { state, size } = parsed;
  const yes = step.yes ?? 0;
  const no = yes === 0 ? 1 : 0;
  if (step.check === 'connected') return sameGroup(state.board, size, parsed.targets) ? yes : no;
  if (step.check === 'legal') return play(state, parsed.answers[0]).ok ? yes : no;
  if (step.check === 'eye') return eyeKind(state.board, size, parsed.answers[0]) === 'real' ? yes : no;
  if (step.check === 'chase') return chaseWins(state, foeTarget(parsed)) ? yes : no;
  if (step.check === 'alive') {
    const t = parsed.targets[0];
    return survives({ ...state, turn: opponent(state.board[t]) }, t) ? yes : no;
  }
  if (step.check === 'winner') {
    const s = score(state);
    return s.winner === BLACK ? 0 : s.winner === WHITE ? 1 : -1;
  }
  if (step.check === 'owner') {
    const o = score(state).owner[parsed.dots[0]];
    return o === BLACK ? 0 : o === WHITE ? 1 : 2;
  }
  return null;
}

// 수순 문제의 수 (좌표 → 자리 번호)
function sequenceLine(step, parsed) {
  return (step.line || []).map((c) => fromCoord(parsed.size, c));
}

// 문제에서 "잡을 대상"이 되는 상대 돌 (둘 차례의 반대 색으로 표시한 돌)
function foeTarget(parsed) {
  const { state } = parsed;
  return parsed.targets.find((t) => state.board[t] === opponent(state.turn));
}

// 틀린 횟수와 힌트 사용 횟수로 별을 정한다.
function starsFor(mistakes, hints) {
  const n = mistakes + hints;
  if (n === 0) return 3;
  if (n <= 2) return 2;
  return 1;
}

// 차시 자료 한 걸음을 검사해 문제점 목록을 돌려준다 (없으면 빈 배열). 빌드와 테스트에서 쓴다.
function validateStep(step) {
  const problems = [];
  if (!STEP_TYPES.includes(step.type)) return ['모르는 걸음 종류: ' + step.type];
  if (!step.text || typeof step.text !== 'string') problems.push('설명 글이 없다');
  else if ((step.text.match(/[.!?]+(\s|$)/g) || []).length > 3) problems.push('글이 세 문장을 넘는다');

  let parsed = null;
  if (step.board) {
    try {
      parsed = parseBoard(step.board);
    } catch (err) {
      return [...problems, String(err.message)];
    }
    const { size, state } = parsed;
    for (let i = 0; i < state.board.length; i++) {
      if (state.board[i] !== EMPTY && groupAt(state.board, size, i).liberties.length === 0) {
        problems.push('활로가 없는 돌이 판 위에 있다');
        break;
      }
    }
  } else if (step.type !== 'explain' && step.type !== 'choice') {
    return [...problems, '판 그림이 필요하다'];
  }
  const sorted = (list) => [...list].sort((a, b) => a - b).join(',');

  if (step.type === 'move') {
    if (parsed.answers.length === 0) problems.push('정답 자리(*)가 없다');
    for (const a of parsed.answers) if (!play(parsed.state, a).ok) problems.push('정답 자리에 둘 수 없다');
    if (!step.check) problems.push('검산 조건(check)이 없다');
    else if (problems.length === 0) {
      const real = movesFor(step.check, parsed.state, parsed.targets);
      if (sorted(real) !== sorted(parsed.answers)) {
        problems.push('정답이 조건(' + step.check + ')과 다르다: 자료 [' + sorted(parsed.answers) + '], 실제 [' + sorted(real) + ']');
      }
      // 사활 문제는 그 수를 두지 않으면 결과가 반대여야 문제가 된다.
      if (step.check === 'live') {
        const t = parsed.targets.find((p) => parsed.state.board[p] === parsed.state.turn);
        if (survives(pass(parsed.state), t)) problems.push('두지 않아도 이미 살아 있다');
        if (insideRegion(parsed.state, t).filter((p) => parsed.state.board[p] === EMPTY).length > 9) problems.push('안쪽 범위가 너무 넓다(돌이 둘러싸여 있지 않다)');
      }
      if (step.check === 'kill') {
        const t = foeTarget(parsed);
        if (!survives(pass(parsed.state), t)) problems.push('두지 않아도 이미 죽어 있다');
        if (insideRegion(parsed.state, t).filter((p) => parsed.state.board[p] === EMPTY).length > 9) problems.push('안쪽 범위가 너무 넓다(돌이 둘러싸여 있지 않다)');
      }
    }
  }
  if (step.type === 'count') {
    if (!Array.isArray(step.choices) || !step.choices.includes(step.answer)) problems.push('보기에 정답이 없다');
    const real = countFor(step, parsed);
    if (real === null) problems.push('검산 조건(check)이 없다');
    else if (real !== step.answer) problems.push('정답 ' + step.answer + ' 이(가) 실제 값 ' + real + ' 과 다르다');
  }
  if (step.type === 'choice') {
    if (!Array.isArray(step.choices) || !(step.answer >= 0 && step.answer < step.choices.length)) problems.push('정답 번호가 보기 범위를 벗어났다');
    if (step.check) {
      if (!parsed) problems.push('판 그림이 필요하다');
      else {
        const real = choiceFor(step, parsed);
        if (real === null) problems.push('모르는 조건: ' + step.check);
        else if (real !== step.answer) problems.push('정답 번호 ' + step.answer + ' 이(가) 실제 ' + real + ' 과 다르다');
      }
    }
  }
  if (step.type === 'point') {
    const groups = pointTargets(step, parsed);
    if (groups.length === 0 || groups.some((g) => g.length === 0)) problems.push('짚을 정답이 없다');
    if (step.need !== 'one' && step.need !== 'all') problems.push('need 는 one 또는 all 이어야 한다');
  }
  if (step.type === 'explore') {
    const groups = new Set();
    parsed.state.board.forEach((c, i) => {
      if (c !== EMPTY) groups.add(Math.min(...groupAt(parsed.state.board, parsed.size, i).stones));
    });
    if (!(step.need >= 1 && step.need <= groups.size)) problems.push('눌러 볼 돌 수(need)가 판 위 덩어리 수와 맞지 않는다');
  }
  if (step.type === 'free' && !(step.count >= 1)) problems.push('놓을 돌 수(count)가 없다');
  if (step.type === 'forbidden') {
    const spots = parsed.answers.concat(parsed.ko >= 0 ? [parsed.ko] : []);
    if (spots.length !== 1) problems.push('두어 볼 자리는 한 곳이어야 한다');
    for (const a of spots) {
      const r = play(parsed.state, a);
      if (r.ok || r.reason !== step.reason) problems.push('그 자리는 "' + step.reason + '" 때문에 못 두는 곳이 아니다 (실제: ' + (r.ok ? '둘 수 있음' : r.reason) + ')');
    }
  }
  if (step.type === 'sequence') {
    const line = sequenceLine(step, parsed);
    if (line.length === 0 || line.length % 2 === 0) problems.push('수순은 내 수로 끝나야 한다(홀수 개)');
    let s = parsed.state;
    let last = null;
    for (const m of line) {
      const r = m >= 0 ? play(s, m) : { ok: false };
      if (!r.ok) { problems.push('수순 가운데 둘 수 없는 수가 있다'); last = null; break; }
      s = r.state;
      last = r;
    }
    if (last && step.check === 'capture' && last.captured.length === 0) problems.push('마지막 수가 돌을 따내지 못한다');
  }
  if (step.type === 'chase') {
    const t = foeTarget(parsed);
    if (t === undefined) problems.push('잡을 대상(표시한 상대 돌)이 없다');
    else {
      const wins = chaseWinningMoves(parsed.state, t);
      if (wins.length === 0) problems.push('몰아서 잡을 수 없는 모양이다');
      else {
        if (sorted(wins) !== sorted(parsed.answers)) problems.push('첫 수가 다르다: 자료 [' + sorted(parsed.answers) + '], 실제 [' + sorted(wins) + ']');
        const run = chasePlayout(parsed.state, t);
        if (!run.captured) problems.push('끝까지 두어도 잡히지 않는다');
        if (step.moves && run.myMoves !== step.moves) problems.push('내 수의 개수가 다르다: 자료 ' + step.moves + ', 실제 ' + run.myMoves);
      }
    }
  }
  return problems;
}

// ---- src/lessons/tools.mjs ----
// 판 그림을 다루는 작은 도구. 같은 모양을 뒤집거나 색을 바꿔 다른 문제로 쓴다.
// 뒤집은 판도 테스트가 규칙 엔진으로 다시 검산하므로, 손으로 새로 그리는 것보다 틀릴 일이 적다.

// 위쪽 몇 줄만 적고 나머지는 빈 줄로 채운다. 예: fill(7, ['..X....', '.XO....'])
function fill(size, top) {
  const rows = top.slice();
  while (rows.length < size) rows.push('.'.repeat(size));
  return rows;
}

// 좌우로 뒤집기
function flipH(rows) {
  return rows.map((r) => [...r].reverse().join(''));
}

// 위아래로 뒤집기
function flipV(rows) {
  return rows.slice().reverse();
}

// 흑과 백을 맞바꾸기
function swapColors(rows) {
  const map = { X: 'O', O: 'X', x: 'o', o: 'x' };
  return rows.map((r) => [...r].map((ch) => map[ch] || ch).join(''));
}

// ---- src/store.mjs ----
// 프로필과 진행도 저장. 기기 안(localStorage)에만 저장하고 밖으로 보내지 않는다.
// storage 는 getItem/setItem 을 가진 객체. 저장이 막힌 환경에서도 앱은 동작한다(저장만 안 됨).

// 저장 형식
// - version: 1 은 그대로 둔다. v1.0 앱도 같은 칸을 읽으므로, 새 칸은 "더하기만" 한다(v1.0은 모르는 칸을 무시함).
// - rev: 자료 개정 번호. 1(v1.0, 칸 없음) → 2(v1.1, 프로필마다 review 목록 추가).
const STORE_KEY = 'baduk-guide:v1';
const STORE_REV = 2;
const MAX_PROFILES = 5;
const MAX_NAME = 8;
const MAX_REVIEW = 60;
const BACKUP_APP = 'baduk-guide';

function emptyData() {
  return { version: 1, rev: STORE_REV, current: null, profiles: [] };
}

function isValid(d) {
  return Boolean(d) && d.version === 1 && Array.isArray(d.profiles) &&
    d.profiles.every((p) => p && typeof p.id === 'string' && typeof p.name === 'string' && p.done && typeof p.done === 'object');
}

// 예전 형식(rev 없음)이나 빠진 칸이 있는 자료를 지금 형식으로 맞춘다. 맞출 수 없으면 null.
function migrateData(d) {
  if (!isValid(d)) return null;
  const profiles = d.profiles.map((p) => {
    const done = {};
    for (const [k, v] of Object.entries(p.done)) {
      const stars = v && Number.isFinite(v.stars) ? Math.max(0, Math.min(3, Math.round(v.stars))) : 1;
      done[k] = { stars };
    }
    const missions = {};
    if (p.missions && typeof p.missions === 'object') for (const [k, v] of Object.entries(p.missions)) if (v) missions[k] = true;
    const review = Array.isArray(p.review) ? [...new Set(p.review.filter((k) => typeof k === 'string' && k.length <= 20))].slice(-MAX_REVIEW) : [];
    return {
      id: p.id, name: p.name,
      color: Number.isInteger(p.color) ? p.color : 0,
      done, missions, review,
      last: typeof p.last === 'string' ? p.last : null,
    };
  });
  const current = profiles.some((p) => p.id === d.current) ? d.current : (profiles[0] ? profiles[0].id : null);
  return { version: 1, rev: STORE_REV, current, profiles };
}

// 기록 파일(내보내기 결과)을 검사한다. { ok: true, data } 또는 { ok: false, error }
// error: 'format'(JSON이 아님·모양이 다름) | 'app'(다른 앱의 파일) | 'profiles'(프로필 자료가 망가짐) | 'too-many'
function validateBackup(obj) {
  if (typeof obj === 'string') {
    try { obj = JSON.parse(obj); } catch (err) { return { ok: false, error: 'format' }; }
  }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, error: 'format' };
  if (obj.app !== BACKUP_APP || obj.kind !== 'backup') return { ok: false, error: 'app' };
  const raw = obj.data;
  if (!raw || !Array.isArray(raw.profiles)) return { ok: false, error: 'format' };
  if (raw.profiles.length > MAX_PROFILES) return { ok: false, error: 'too-many' };
  const data = migrateData(raw);
  if (!data) return { ok: false, error: 'profiles' };
  const ids = new Set();
  const names = new Set();
  for (const p of data.profiles) {
    const clean = cleanName(p.name);
    if (!clean || clean !== p.name || ids.has(p.id) || names.has(p.name)) return { ok: false, error: 'profiles' };
    ids.add(p.id);
    names.add(p.name);
  }
  return { ok: true, data };
}

function cleanName(name) {
  return [...String(name ?? '').replace(/\s+/g, ' ').trim()].slice(0, MAX_NAME).join('');
}

function createStore(storage) {
  let data = emptyData();
  try {
    const raw = storage.getItem(STORE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    const migrated = migrateData(parsed);
    if (migrated) data = migrated;
  } catch (err) {
    data = emptyData();
  }

  const save = () => {
    try {
      storage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (err) {
      // 저장이 막혀 있으면 이번 실행 동안만 기억한다.
    }
  };
  const current = () => data.profiles.find((p) => p.id === data.current) || null;

  return {
    profiles: () => data.profiles.map((p) => ({ ...p })),
    current,

    // 성공하면 프로필, 실패하면 { error: 'empty' | 'full' | 'duplicate' }
    addProfile(name) {
      const clean = cleanName(name);
      if (!clean) return { error: 'empty' };
      if (data.profiles.length >= MAX_PROFILES) return { error: 'full' };
      if (data.profiles.some((p) => p.name === clean)) return { error: 'duplicate' };
      const used = data.profiles.map((p) => Number(p.id.slice(1)) || 0);
      const n = Math.max(0, ...used) + 1;
      const colors = data.profiles.map((p) => p.color);
      let color = 0;
      while (colors.includes(color) && color < MAX_PROFILES) color++;
      const profile = { id: 'p' + n, name: clean, color, done: {}, missions: {}, review: [], last: null };
      data.profiles.push(profile);
      data.current = profile.id;
      save();
      return profile;
    },

    selectProfile(id) {
      if (!data.profiles.some((p) => p.id === id)) return false;
      data.current = id;
      save();
      return true;
    },

    removeProfile(id) {
      const before = data.profiles.length;
      data.profiles = data.profiles.filter((p) => p.id !== id);
      if (data.profiles.length === before) return false;
      if (data.current === id) data.current = data.profiles[0] ? data.profiles[0].id : null;
      save();
      return true;
    },

    // 차시 완료. 별은 가장 좋았던 기록을 남긴다.
    completeLesson(lessonId, stars) {
      const p = current();
      if (!p) return;
      const prev = p.done[lessonId] ? p.done[lessonId].stars : 0;
      p.done[lessonId] = { stars: Math.max(prev, stars) };
      p.last = lessonId;
      save();
    },
    isDone(lessonId) {
      const p = current();
      return Boolean(p && p.done[lessonId]);
    },
    starsOf(lessonId) {
      const p = current();
      return p && p.done[lessonId] ? p.done[lessonId].stars : 0;
    },

    completeMission(missionId) {
      const p = current();
      if (!p) return;
      p.missions = p.missions || {};
      p.missions[missionId] = true;
      save();
    },
    missionDone(missionId) {
      const p = current();
      return Boolean(p && p.missions && p.missions[missionId]);
    },

    // 복습: 틀렸거나 힌트를 본 문제(차시 id + ':' + 걸음 번호). 다시 한 번에 맞히면 빠진다.
    reviewList() {
      const p = current();
      return p ? [...p.review] : [];
    },
    addReview(key) {
      const p = current();
      if (!p || typeof key !== 'string') return;
      p.review = p.review.filter((k) => k !== key);
      p.review.push(key);
      if (p.review.length > MAX_REVIEW) p.review = p.review.slice(-MAX_REVIEW);
      save();
    },
    resolveReview(key) {
      const p = current();
      if (!p || !p.review.includes(key)) return false;
      p.review = p.review.filter((k) => k !== key);
      save();
      return true;
    },

    // 기록 내보내기·가져오기 (파일로 옮기기)
    exportBackup(now = new Date()) {
      return { app: BACKUP_APP, kind: 'backup', exportedAt: now.toISOString(), data: JSON.parse(JSON.stringify(data)) };
    },
    importBackup(obj) {
      const r = validateBackup(obj);
      if (!r.ok) return r;
      data = r.data;
      save();
      return { ok: true, count: data.profiles.length };
    },
  };
}

// 테스트와 저장이 막힌 환경에서 쓰는 메모리 저장소
function memoryStorage() {
  const map = new Map();
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => { map.set(k, String(v)); },
  };
}

// storage 는 getItem/setItem 을 가진 객체. 저장이 막혀 있으면 기본값으로 동작한다.

const APP_VERSION = '1.2.0';
const SETTINGS_KEY = 'baduk-guide:settings';
const THEMES = ['auto', 'dark', 'light'];

const DEFAULT_SETTINGS = Object.freeze({

const WHATS_NEW = [

];

function cleanSettings(s) {
  const out = { ...DEFAULT_SETTINGS };
  if (!s || typeof s !== 'object') return out;
  if (typeof s.sound === 'boolean') out.sound = s.sound;
  if (typeof s.vibrate === 'boolean') out.vibrate = s.vibrate;
  if (THEMES.includes(s.theme)) out.theme = s.theme;
  if (typeof s.seen === 'string' && s.seen.length <= 20) out.seen = s.seen;
  if (typeof s.coach === 'boolean') out.coach = s.coach;
  return out;
}

function loadSettings(storage) {
  try {
    const raw = storage.getItem(SETTINGS_KEY);
    return cleanSettings(raw ? JSON.parse(raw) : null);
  } catch (err) {
    return cleanSettings(null);
  }
}

function saveSettings(storage, s) {
  const clean = cleanSettings(s);
  try {
    storage.setItem(SETTINGS_KEY, JSON.stringify(clean));
  } catch (err) {
    // 저장이 막혀 있으면 이번 실행 동안만 쓴다.
  }
  return clean;
}

// 실제로 쓸 화면: 'auto' 면 기기 설정(prefersLight)을 따른다.
function resolveTheme(theme, prefersLight) {
  if (theme === 'light') return 'light';
  if (theme === 'dark') return 'dark';
  return prefersLight ? 'light' : 'dark';
}

// "새로 생긴 것"을 보여 줄지. 처음 쓰는 사람(프로필 없음)에게는 보여 주지 않고 본 것으로 친다.
function compareVersion(a, b) {
  const pa = String(a || '0').split('.').map((n) => Number(n) || 0);
  const pb = String(b || '0').split('.').map((n) => Number(n) || 0);
  for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}

// 마지막으로 본 판(seen) 뒤에 생긴 항목. seen 이 비어 있으면(v1.0에서 올라옴) 전부.
function newsSince(seen) {
  return WHATS_NEW.filter((n) => !seen || compareVersion(n.v, seen) > 0);
}

function shouldShowNews(settings, hasProfiles) {
  return Boolean(hasProfiles) && newsSince(settings.seen).length > 0;
}

// ---- src/ui/sound.js ----
// 돌 소리와 진동. 소리 파일 없이 WebAudio로 그때그때 만든다.
// - 첫 터치·키 입력 전에는 소리를 내지 않는다(브라우저 정책, 갑자기 소리 나지 않게).
// - 설정에서 끄면(soundPrefs.sound = false) 아무 소리도 내지 않는다. 화면이 가려져 있을 때도 내지 않는다.

const soundPrefs = { sound: true, vibrate: true };
const MASTER_VOLUME = 0.22; // 작게
let audioCtx = null;
let userGestured = false;

function markGesture() {
  userGestured = true;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
window.addEventListener('pointerdown', markGesture, { capture: true });
window.addEventListener('keydown', markGesture, { capture: true });

function getAudio() {
  if (!userGestured || !soundPrefs.sound || document.hidden) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    try { audioCtx = new AC(); } catch (err) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

// 짧은 "딱": 걸러 낸 잡음 한 조각 + 낮은 울림
function clack(ac, t, gainMul) {
  const len = Math.floor(ac.sampleRate * 0.04);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2400;
  bp.Q.value = 1.2;
  const g = ac.createGain();
  g.gain.value = MASTER_VOLUME * 1.6 * gainMul;
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t);

  const o = ac.createOscillator();
  const og = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.07);
  og.gain.setValueAtTime(MASTER_VOLUME * 0.8 * gainMul, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(og).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.09);
}

function tone(ac, t, freq, dur, type, vol) {
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(MASTER_VOLUME * vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

const VIBRATE_PATTERN = { place: 8, capture: [12, 40, 12], ok: 16, bad: [24, 50, 24] };

// kind: place(돌 놓기) | capture(따내기) | ok(맞음) | bad(아쉬움)
function playCue(kind) {
  if (soundPrefs.vibrate && userGestured && navigator.vibrate && VIBRATE_PATTERN[kind] !== undefined) {
    try { navigator.vibrate(VIBRATE_PATTERN[kind]); } catch (err) { /* 진동이 막힌 기기 */ }
  }
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime + 0.005;
  if (kind === 'place') clack(ac, t, 1);
  else if (kind === 'capture') {
    clack(ac, t, 1);
    tone(ac, t + 0.09, 660, 0.09, 'triangle', 0.5);
    tone(ac, t + 0.16, 880, 0.12, 'triangle', 0.5);
  } else if (kind === 'ok') {
    tone(ac, t, 784, 0.12, 'sine', 0.6);
    tone(ac, t + 0.1, 1047, 0.18, 'sine', 0.6);
  } else if (kind === 'bad') {
    tone(ac, t, 247, 0.2, 'triangle', 0.55);
  }
}

function setSoundPrefs(p) {
  soundPrefs.sound = Boolean(p.sound);
  soundPrefs.vibrate = Boolean(p.vibrate);
}

const canVibrate = () => typeof navigator.vibrate === 'function';

// ---- src/ui/board.js ----
// 바둑판 그리기 (SVG). 규칙은 모르고, 받은 상태와 표시만 그린다.
// 빌드할 때 rules.mjs 등과 한 스크립트로 합쳐지므로 EMPTY, BLACK, toCoord 같은 이름을 그대로 쓴다.

const SVG_NS = 'http://www.w3.org/2000/svg';
const CELL = 40;

function svgEl(name, attrs) {
  const node = document.createElementNS(SVG_NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

// 판 크기에 따라 화면에서 차지할 최대 너비. 작은 판이 너무 커지지 않게 한다.
function boardMaxWidth(size) {
  if (size <= 5) return 360;
  if (size <= 7) return 440;
  return 560;
}

// model: {
//   state,            규칙 엔진의 대국 상태 (필수)
//   coords,           좌표 글자를 보일지
//   showLast,         마지막 수 표시
//   atari,            단수 된 돌에 점선 테두리
//   libs: [idx],      활로 표시(초록 점)
//   marks: [{ at, shape }],  shape: tri | dot | cross | ring | found | miss
//   labels: [{ at, text }],  이름표
//   owner: [색],      집 표시 (계가 때)
//   ghost,            마우스로 가리킨 자리에 반투명 돌
// }
function createBoardView(svg, onTap) {
  let model = null;
  let margin = 30;
  let cursor = -1; // 키보드로 고르는 자리
  let kbd = false; // 키보드를 쓰는 중이면 커서를 보인다
  let prevBoard = null;
  let prevSize = 0;
  let live = null;
  const px = (n) => margin + n * CELL;

  function pointFromEvent(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm || !model) return -1;
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    const size = model.state.size;
    const x = Math.round((p.x - margin) / CELL);
    const y = Math.round((p.y - margin) / CELL);
    if (x < 0 || y < 0 || x >= size || y >= size) return -1;
    return y * size + x;
  }

  function stone(x, y, color, cls) {
    const g = svgEl('g', cls ? { class: cls } : {});
    g.appendChild(svgEl('circle', { class: 'stone-shadow', cx: px(x) + 1.2, cy: px(y) + 2, r: CELL * 0.47 }));
    g.appendChild(svgEl('circle', {
      cx: px(x), cy: px(y), r: CELL * 0.47,
      fill: color === BLACK ? 'url(#gB)' : 'url(#gW)',
      stroke: color === BLACK ? '#000' : '#5e5545',
      'stroke-width': color === BLACK ? 0.8 : 1.2,
    }));
    return g;
  }

  function drawMark(mark, state) {
    const size = state.size;
    const x = mark.at % size;
    const y = (mark.at - x) / size;
    const cx = px(x);
    const cy = px(y);
    const on = state.board[mark.at];
    if (mark.shape === 'tri') {
      const r = CELL * 0.26;
      const pts = [[cx, cy - r], [cx - r * 0.92, cy + r * 0.62], [cx + r * 0.92, cy + r * 0.62]].map((p) => p.join(',')).join(' ');
      svg.appendChild(svgEl('polygon', { class: 'mark-tri', points: pts, stroke: on === BLACK ? '#fff' : '#1b1b1b' }));
    } else if (mark.shape === 'dot') {
      svg.appendChild(svgEl('circle', { class: 'lib', cx, cy, r: 6.5 }));
    } else if (mark.shape === 'cross') {
      const d = 6;
      svg.appendChild(svgEl('path', { class: 'mark-cross', d: 'M' + (cx - d) + ' ' + (cy - d) + 'L' + (cx + d) + ' ' + (cy + d) + 'M' + (cx + d) + ' ' + (cy - d) + 'L' + (cx - d) + ' ' + (cy + d) }));
    } else if (mark.shape === 'ring') {
      svg.appendChild(svgEl('circle', { class: 'mark-ring', cx, cy, r: CELL * 0.36 }));
    } else if (mark.shape === 'found') {
      svg.appendChild(svgEl('circle', { class: 'mark-found', cx, cy, r: 10 }));
      svg.appendChild(svgEl('path', { class: 'mark-glyph', d: 'M' + (cx - 5) + ' ' + cy + 'l3.6 3.8l6.4 -7.4' }));
    } else if (mark.shape === 'miss') {
      const d = 4;
      svg.appendChild(svgEl('circle', { class: 'mark-miss', cx, cy, r: 10 }));
      svg.appendChild(svgEl('path', { class: 'mark-glyph', d: 'M' + (cx - d) + ' ' + (cy - d) + 'L' + (cx + d) + ' ' + (cy + d) + 'M' + (cx + d) + ' ' + (cy - d) + 'L' + (cx - d) + ' ' + (cy + d) }));
    }
  }

  function draw(next) {
    model = next;
    const state = model.state;
    const size = state.size;
    if (svg.parentElement) svg.parentElement.style.maxWidth = boardMaxWidth(size) + 'px';
    // 좌표 글자가 화면에서 9px보다 작아지는 판(휴대폰의 13줄, 19줄)에서는 좌표를 숨긴다.
    let coords = Boolean(model.coords);
    const shown = svg.getBoundingClientRect().width;
    if (coords && shown > 0 && shown / (34 * 2 + (size - 1) * CELL) * 13 < 9) coords = false;
    margin = coords ? 34 : 30;
    const extent = margin * 2 + (size - 1) * CELL;
    svg.setAttribute('viewBox', '0 0 ' + extent + ' ' + extent);
    svg.textContent = '';

    const defs = svgEl('defs', {});
    defs.innerHTML =
      '<radialGradient id="gB" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#707070"/><stop offset="0.6" stop-color="#1b1b1b"/><stop offset="1" stop-color="#050505"/></radialGradient>' +
      '<radialGradient id="gW" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#ece8df"/><stop offset="1" stop-color="#cfc9bc"/></radialGradient>';
    svg.appendChild(defs);

    for (let i = 0; i < size; i++) {
      svg.appendChild(svgEl('line', { class: 'grid', x1: px(0), y1: px(i), x2: px(size - 1), y2: px(i) }));
      svg.appendChild(svgEl('line', { class: 'grid', x1: px(i), y1: px(0), x2: px(i), y2: px(size - 1) }));
    }
    for (const [x, y] of starPoints(size)) {
      svg.appendChild(svgEl('circle', { class: 'star', cx: px(x), cy: px(y), r: 3.6 }));
    }

    if (coords) {
      for (let i = 0; i < size; i++) {
        const col = svgEl('text', { class: 'label', x: px(i), y: extent - 11 });
        col.textContent = toCoord(size, i)[0];
        svg.appendChild(col);
        const row = svgEl('text', { class: 'label', x: 11, y: px(i) });
        row.textContent = String(size - i);
        svg.appendChild(row);
      }
    }

    if (model.owner) {
      model.owner.forEach((c, idx) => {
        if (c === EMPTY) return;
        const x = idx % size;
        svg.appendChild(svgEl('rect', {
          class: 'terr', x: px(x) - 6, y: px((idx - x) / size) - 6, width: 12, height: 12, rx: 2,
          fill: c === BLACK ? '#1b1b1b' : '#fffdf5', stroke: c === BLACK ? 'none' : '#a59e8e',
        }));
      });
    }

    state.board.forEach((c, idx) => {
      if (c === EMPTY) return;
      const x = idx % size;
      svg.appendChild(stone(x, (idx - x) / size, c));
    });

    if (model.showLast !== false && state.lastMove >= 0 && state.board[state.lastMove] !== EMPTY) {
      const x = state.lastMove % size;
      const c = state.board[state.lastMove];
      svg.appendChild(svgEl('circle', { class: 'last', cx: px(x), cy: px((state.lastMove - x) / size), r: CELL * 0.2, stroke: c === BLACK ? '#fff' : '#222' }));
    }

    if (model.atari) {
      for (const g of groupsInAtari(state)) {
        for (const s of g.stones) {
          const x = s % size;
          svg.appendChild(svgEl('circle', { class: 'atari', cx: px(x), cy: px((s - x) / size), r: CELL * 0.47 + 2.5 }));
        }
      }
    }

    if (state.ko >= 0) {
      const x = state.ko % size;
      svg.appendChild(svgEl('rect', { class: 'ko', x: px(x) - 7, y: px((state.ko - x) / size) - 7, width: 14, height: 14 }));
    }

    for (const l of model.libs || []) drawMark({ at: l, shape: 'dot' }, state);
    for (const m of model.marks || []) drawMark(m, state);

    for (const l of model.labels || []) {
      const x = l.at % size;
      const cx = px(x);
      const cy = px((l.at - x) / size);
      const w = 16 + l.text.length * 15;
      svg.appendChild(svgEl('rect', { class: 'tag-bg', x: cx - w / 2, y: cy - 13, width: w, height: 26, rx: 13 }));
      const t = svgEl('text', { class: 'tag-text', x: cx, y: cy + 1 });
      t.textContent = l.text;
      svg.appendChild(t);
    }

    const ghost = stone(0, 0, state.turn, 'ghost');
    ghost.setAttribute('visibility', 'hidden');
    svg.appendChild(ghost);
    svg._ghost = ghost;
    svg.classList.toggle('tappable', Boolean(onTap));

    // 키보드 커서
    if (cursor >= size * size) cursor = -1;
    if (onTap && kbd && cursor >= 0) {
      const x = cursor % size;
      const y = (cursor - x) / size;
      svg.appendChild(svgEl('rect', { class: 'kbd-cursor', x: px(x) - CELL / 2 + 1, y: px(y) - CELL / 2 + 1, width: CELL - 2, height: CELL - 2, rx: 8 }));
      if (model.ghost && state.board[cursor] === EMPTY) {
        ghost.setAttribute('transform', 'translate(' + x * CELL + ' ' + y * CELL + ')');
        ghost.setAttribute('visibility', 'visible');
      }
    }

    // 소리: 빈 자리에 돌 하나가 새로 놓였을 때만(새 문제로 판이 통째로 바뀐 때는 소리 없음)
    const b = state.board;
    if (prevBoard && prevSize === size && state.lastMove >= 0 && prevBoard[state.lastMove] === EMPTY && b[state.lastMove] !== EMPTY) {
      let added = 0;
      let removed = 0;
      for (let k = 0; k < b.length; k++) {
        if (prevBoard[k] === EMPTY && b[k] !== EMPTY) added++;
        else if (prevBoard[k] !== EMPTY && b[k] === EMPTY) removed++;
      }
      if (added === 1) playCue(removed > 0 ? 'capture' : 'place');
    }
    prevBoard = b.slice();
    prevSize = size;
  }

  function describe(idx) {
    const c = model.state.board[idx];
    return toCoord(model.state.size, idx) + (c === BLACK ? ', 흑돌' : c === WHITE ? ', 백돌' : ', 빈 자리');
  }

  if (onTap) {
    svg.setAttribute('tabindex', '0');
    svg.setAttribute('role', 'application');
    svg.setAttribute('aria-roledescription', '바둑판');
    svg.setAttribute('aria-label', '바둑판. 화살표로 자리를 옮기고 Enter나 스페이스로 돌을 놓아요. P는 한 수 쉬기');
    live = document.createElement('p');
    live.className = 'sr-only';
    live.setAttribute('aria-live', 'polite');
    if (svg.parentElement) svg.parentElement.appendChild(live);
    svg.addEventListener('keydown', (e) => {
      if (!model) return;
      const size = model.state.size;
      if (cursor < 0) cursor = Math.floor(size / 2) * (size + 1);
      let x = cursor % size;
      let y = (cursor - x) / size;
      const k = e.key;
      if (k === 'ArrowLeft') x = Math.max(0, x - 1);
      else if (k === 'ArrowRight') x = Math.min(size - 1, x + 1);
      else if (k === 'ArrowUp') y = Math.max(0, y - 1);
      else if (k === 'ArrowDown') y = Math.min(size - 1, y + 1);
      else if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        kbd = true;
        onTap(cursor);
        return;
      } else if (k === 'p' || k === 'P' || k === 'ㅔ') {
        const pb = document.getElementById('passBtn');
        if (pb && !pb.disabled && !pb.hidden && pb.offsetParent !== null) {
          e.preventDefault();
          pb.click();
        }
        return;
      } else return;
      e.preventDefault();
      kbd = true;
      cursor = y * size + x;
      draw(model);
      if (live) live.textContent = describe(cursor);
    });
    svg.addEventListener('focus', () => {
      if (!model || !svg.matches(':focus-visible')) return;
      kbd = true;
      if (cursor < 0) cursor = Math.floor(model.state.size / 2) * (model.state.size + 1);
      draw(model);
    });
    svg.addEventListener('blur', () => {
      if (!kbd || !model) return;
      kbd = false;
      draw(model);
    });
    svg.addEventListener('pointerdown', () => { kbd = false; });
  }

  svg.addEventListener('click', (e) => {
    const idx = pointFromEvent(e);
    if (idx >= 0 && onTap) onTap(idx);
  });
  svg.addEventListener('pointermove', (e) => {
    const ghost = svg._ghost;
    if (!ghost || !model) return;
    const idx = model.ghost && e.pointerType === 'mouse' ? pointFromEvent(e) : -1;
    if (idx < 0 || model.state.board[idx] !== EMPTY) {
      ghost.setAttribute('visibility', 'hidden');
      return;
    }
    const size = model.state.size;
    const x = idx % size;
    ghost.setAttribute('transform', 'translate(' + x * CELL + ' ' + ((idx - x) / size) * CELL + ')');
    ghost.setAttribute('visibility', 'visible');
  });
  svg.addEventListener('pointerleave', () => {
    if (svg._ghost) svg._ghost.setAttribute('visibility', 'hidden');
  });

  return { draw };
}

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

function isUnlocked(lesson) {
  const i = LESSONS.indexOf(lesson);
  return i === 0 || store.isDone(LESSONS[i - 1].id);
}

function nextLessonFor() {
  return LESSONS.find((l) => !store.isDone(l.id)) || null;
}

function route() {
  if (leaveView) {
    leaveView();
    leaveView = null;
  }
  const open = document.querySelector('dialog[open]');
  if (open) open.close();
  const h = location.hash || '#/';
  window.scrollTo(0, 0);
  let m = /^#\/lesson\/(L\d+)$/.exec(h);
  if (m) {
    const lesson = lessonById(m[1]);
    if (lesson && store.current() && isUnlocked(lesson)) return viewLesson(lesson);
    return go('#/');
  }
  m = /^#\/quiz\/(Q\d+)$/.exec(h);
  if (m && quizById(m[1])) return viewLesson(quizById(m[1]));
  if (h === '#/capture') return viewCapture();
  if (h === '#/count') return viewCount();
  if (h === '#/game') return viewGame();
  if (h === '#/practice') return viewPractice();
  if (h === '#/terms') return viewTerms();
  if (h === '#/review') {
    const lesson = store.current() ? reviewLesson() : null;
    if (lesson) return viewLesson(lesson);
    return go('#/');
  }
  return viewHome();
}

// 복습 문제 묶음. 열쇠는 '차시 id:걸음 번호'. 자료가 바뀌어 찾을 수 없는 것은 목록에서 뺀다.
function reviewLesson() {
  const keys = [];
  const steps = [];
  for (const key of store.reviewList()) {
    const [lid, n] = key.split(':');
    const src = lessonById(lid) || quizById(lid);
    const step = src && src.steps[Number(n)];
    if (!step || step.type === 'explain') {
      store.resolveReview(key);
      continue;
    }
    keys.push(key);
    steps.push(step);
  }
  if (!steps.length) return null;
  return { id: 'REVIEW', review: true, title: '틀린 문제 다시 풀기', steps, keys, summary: '' };
}

// 판 그림(줄 문자열)을 그대로 그린다. 설명용 작은 판에 쓴다.
function parsedMarks(p, board) {
  const marks = [];
  for (const t of p.targets) if (board[t] !== EMPTY) marks.push({ at: t, shape: 'tri' });
  for (const d of p.dots) marks.push({ at: d, shape: 'dot' });
  for (const c of p.crosses) marks.push({ at: c, shape: 'cross' });
  return marks;
}

function toggleDead(dead, state, idx) {
  if (state.board[idx] === EMPTY) return false;
  const stones = groupAt(state.board, state.size, idx).stones;
  const all = stones.every((s) => dead.has(s));
  for (const s of stones) {
    if (all) dead.delete(s);
    else dead.add(s);
  }
  return true;
}

const PATH_STEP = 92;
const PATH_OFFSETS = [0, 40, 56, 40, 0, -40, -56, -40];

function drawPathLines() {
  document.querySelectorAll('.path').forEach((el) => {
    const svg = el.querySelector('.path-line');
    const nodes = [...el.querySelectorAll('.node')];
    const w = el.clientWidth;
    if (!svg || w === 0 || nodes.length === 0) return;
    const pts = nodes.map((n, i) => [w / 2 + PATH_OFFSETS[i % PATH_OFFSETS.length], 32 + i * PATH_STEP]);
    const d = (upto) => pts.slice(0, upto + 1).map((p, i) => {
      if (i === 0) return 'M' + p[0] + ' ' + p[1];
      const q = pts[i - 1];
      return 'C' + q[0] + ' ' + (q[1] + PATH_STEP / 2) + ' ' + p[0] + ' ' + (p[1] - PATH_STEP / 2) + ' ' + p[0] + ' ' + p[1];
    }).join('');
    let reached = -1;
    nodes.forEach((n, i) => { if (n.classList.contains('done') || n.classList.contains('next')) reached = Math.max(reached, i); });
    svg.setAttribute('width', w);
    svg.setAttribute('height', nodes.length * PATH_STEP);
    svg.innerHTML = '<path class="line-base" d="' + d(pts.length - 1) + '"/>' + (reached > 0 ? '<path class="line-done" d="' + d(reached) + '"/>' : '');
  });
}

      if (r.error) $('firstErr').textContent = r.error === 'empty' ? '이름을 한 글자 이상 적어 주세요.' : '그 이름은 쓸 수 없어요.';
      else route();
    });
  } else {
    $('profileBtn').addEventListener('click', openProfiles);
  }
  $('settingsBtn').addEventListener('click', openSettings);

  if (shouldShowNews(settings, store.profiles().length > 0)) openNews();
  else if (settings.seen !== APP_VERSION && !store.profiles().length) updateSettings({ seen: APP_VERSION });
}

function openNews(all) {
  const dialog = $('newsDialog');
  const items = all ? WHATS_NEW : newsSince(settings.seen);
  dialog.innerHTML =
    '<div class="dialog-head"><h2 id="newsTitle">새로 생긴 것 · v' + APP_VERSION + '</h2></div>' +
    '<ul class="news-list">' + items.map((n) => '<li><strong>' + esc(n.title) + '</strong><span>' + esc(n.text) + '</span></li>').join('') + '</ul>' +
    '<div class="dialog-actions"><button type="button" class="primary" id="newsOk">알겠어요</button></div>';
  const close = () => { updateSettings({ seen: APP_VERSION }); if (dialog.open) dialog.close(); };
  $('newsOk').addEventListener('click', close);
  dialog.addEventListener('cancel', () => updateSettings({ seen: APP_VERSION }), { once: true });
  dialog.showModal();
}

const BACKUP_ERROR = {
  format: '기록 파일이 아니거나 파일이 깨졌어요.',
  app: '바둑 첫걸음에서 내보낸 파일이 아니에요.',
  profiles: '파일 안의 프로필 자료가 올바르지 않아요.',
  'too-many': '프로필이 ' + MAX_PROFILES + '명보다 많아서 가져올 수 없어요.',
};

function downloadBackup() {
  const data = store.exportBackup();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  a.href = url;
  a.download = '바둑첫걸음_기록_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return data;
}

      '<label class="toggle set-row"><span>진동' + (vib ? '' : ' <small>(이 기기는 진동을 지원하지 않아요)</small>') + '</span><input type="checkbox" id="setVibrate"' + (settings.vibrate ? ' checked' : '') + (vib ? '' : ' disabled') + '></label>' +
      '<div class="set-actions"><button type="button" class="ghost-btn" id="soundTest">소리 들어 보기</button></div>' +

      '<label class="ghost-btn file-btn">기록 가져오기<input type="file" id="importFile" accept="application/json,.json"></label></div>' +
      '<p class="form-msg ' + (noteKind || '') + '" id="setNote" role="status">' + esc(note || '') + '</p></section>' +
      '<p class="set-foot">바둑 첫걸음 v' + APP_VERSION + ' · <button type="button" class="text-btn" id="newsAgain">새로 생긴 것</button></p>';

    $('closeSettings').addEventListener('click', () => dialog.close());
    $('setSound').addEventListener('change', (e) => updateSettings({ sound: e.target.checked }));
    $('setVibrate').addEventListener('change', (e) => updateSettings({ vibrate: e.target.checked }));
    $('soundTest').addEventListener('click', () => {
      const note = $('soundNote');
      if (!settings.sound && !(settings.vibrate && canVibrate())) {
        note.textContent = '소리와 진동이 모두 꺼져 있어요. 위에서 켜 보세요.';
        return;
      }
      ['place', 'capture', 'ok', 'bad'].forEach((k, n) => setTimeout(() => playCue(k), n * 450));
      note.textContent = (settings.sound ? '돌 놓기, 따내기, 맞음, 아쉬움 소리를 차례로 들려줘요.' : '소리는 꺼져 있어요. 진동만 차례로 울려요.') + ' 들리지 않으면 기기 소리 크기와 무음 모드를 확인해 주세요.';
    });
    dialog.querySelectorAll('.theme-seg button').forEach((b) => b.addEventListener('click', () => {
      updateSettings({ theme: b.dataset.theme });
      dialog.querySelectorAll('.theme-seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    $('exportBtn').addEventListener('click', () => {
      const data = downloadBackup();
      draw('프로필 ' + data.data.profiles.length + '명의 기록을 파일로 내보냈어요.', 'ok');
    });
    $('importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      let text = '';
      try { text = await file.text(); } catch (err) { return draw(BACKUP_ERROR.format, 'warn'); }
      const check = validateBackup(text);
      if (!check.ok) return draw(BACKUP_ERROR[check.error] || BACKUP_ERROR.format, 'warn');
      const names = check.data.profiles.map((p) => p.name).join(', ') || '없음';
      if (!confirm('지금 기기의 기록(프로필 ' + store.profiles().length + '명)을 가져온 기록(프로필 ' + check.data.profiles.length + '명: ' + names + ')으로 바꿀까요? 지금 기록은 사라져요.')) return draw('가져오기를 취소했어요.');

      if (!r.ok) return draw(BACKUP_ERROR[r.error] || BACKUP_ERROR.format, 'warn');
      dialog.close();
      route();
    });
    $('newsAgain').addEventListener('click', () => { dialog.close(); openNews(true); });
  };
  draw();
  dialog.showModal();
}

function viewLesson(lesson) {
  const total = lesson.steps.length;
  const eyebrow = lesson.review ? '복습' : lesson.quiz ? lesson.unit + '단원 미션' : lesson.no + '차시';
  let i = 0;
  let mistakes = 0;
  let hints = 0;
  let cleared = 0; // 복습에서 한 번에 맞힌 문제 수
  let S = null; // 지금 걸음의 진행 상태
  let timer = null;
  leaveView = () => { if (timer) clearTimeout(timer); timer = null; };

  root.innerHTML =
    '<div class="lesson-view">' +
    barHtml(eyebrow, lesson.title, '<span class="count" id="stepCount"></span>') +
    '<div class="segs" id="segs" role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="' + total + '">' + '<i></i>'.repeat(total) + '</div>' +
    '<div class="boardwrap" id="wrap"><svg class="board" id="board" role="img" aria-label="바둑판"></svg></div>' +
    '<div class="bubble"><span class="dol" id="dol">' + dolSvg('smile') + '</span><p id="stepText" tabindex="-1"></p></div>' +
    '<div class="choices" id="choices"></div>' +
    '<div class="dock" id="dock"><p class="msg" id="msg" role="status" aria-live="polite"></p>' +
    '<div class="actions"><button type="button" id="hintBtn" class="ghost-btn">힌트</button><button type="button" id="nextBtn" class="primary">다음</button></div></div>' +
    '</div>';

  const view = createBoardView($('board'), onTap);
  $('nextBtn').addEventListener('click', onNext);
  $('hintBtn').addEventListener('click', onHint);

  function draw() {
    const p = S.parsed;
    $('wrap').hidden = !p;
    if (!p) return;
    const type = S.step.type;
    const canPlace = !S.done && !S.busy && ['move', 'free', 'forbidden', 'sequence', 'chase'].includes(type);
    view.draw({
      state: S.state,
      libs: S.libs,
      owner: S.owner,
      marks: parsedMarks(p, S.state.board).concat(S.marks),
      labels: p.labels,
      showLast: S.showLast,
      ghost: canPlace,
    });
  }

  function mood(kind) {
    $('dol').innerHTML = dolSvg(kind);
    $('dol').className = 'dol ' + kind;
  }

  function complete(text) {
    S.done = true;
    S.busy = false;
    say(text || '잘했어요.', 'ok');
    mood('cheer');
    $('nextBtn').disabled = false;
    $('hintBtn').hidden = true;
    draw();
  }

  function miss(text) {
    mistakes++;
    S.flag = true;
    say(text || '아쉬워요. 다시 해 볼까요?', 'warn');
    mood('oops');
  }

  // 지금 두어야 할 자리를 동그라미로 알려 주는 걸음
  function guideMarks() {
    const type = S.step.type;
    if (S.done) return [];
    if (type === 'forbidden') return S.spots.filter((at) => at !== S.parsed.ko).map((at) => ({ at, shape: 'ring' }));
    if (type === 'sequence' && !S.busy) return [{ at: S.line[S.pos], shape: 'ring' }];
    if (type === 'choice' && S.parsed) return S.parsed.answers.map((at) => ({ at, shape: 'ring' }));
    return [];
  }

  function startStep() {
    const step = lesson.steps[i];
    const parsed = step.board ? parseBoard(step.board) : null;
    S = {
      step, parsed,
      state: parsed ? parsed.state : null,
      done: step.type === 'explain',
      busy: false,
      hintLevel: 0,
      libs: [],
      owner: null,
      marks: [],
      showLast: false,
      placed: 0,
      seen: new Set(),
      found: new Set(),
      groups: step.type === 'point' ? pointTargets(step, parsed) : null,
      spots: step.type === 'forbidden' ? parsed.answers.concat(parsed.ko >= 0 ? [parsed.ko] : []) : null,
      line: step.type === 'sequence' ? sequenceLine(step, parsed) : null,
      pos: 0,
      target: step.type === 'chase' ? foeTarget(parsed) : -1,
    };
    S.marks = guideMarks();
    $('stepCount').textContent = (i + 1) + ' / ' + total;
    $('segs').setAttribute('aria-valuenow', String(i));
    [...$('segs').children].forEach((seg, k) => { seg.className = k < i ? 'done' : k === i ? 'now' : ''; });
    $('stepText').textContent = step.text;
    $('nextBtn').disabled = !S.done;
    $('nextBtn').textContent = i === total - 1 ? '마치기' : '다음';
    $('hintBtn').hidden = !(['move', 'count', 'point', 'chase'].includes(step.type) || (step.type === 'choice' && step.hint));
    say('');
    mood('smile');

    const box = $('choices');
    box.textContent = '';
    box.hidden = !(step.type === 'count' || step.type === 'choice');
    if (!box.hidden) {
      box.className = 'choices' + (step.type === 'count' || step.choices.every((c) => String(c).length <= 4) ? ' numbers n' + step.choices.length : '');
      step.choices.forEach((c, n) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'choice';
        b.textContent = step.type === 'count' ? c + (step.unit || '개') : c;
        b.addEventListener('click', () => onChoice(b, step.type === 'count' ? c === step.answer : n === step.answer));
        box.appendChild(b);
      });
    }
    draw();
  }

  function onChoice(button, correct) {
    if (S.done) return;
    if (correct) {
      button.classList.add('correct');
      $('choices').querySelectorAll('button').forEach((b) => { b.disabled = true; });
      if (S.step.check === 'liberties') S.libs = groupAt(S.state.board, S.parsed.size, S.parsed.targets[0]).liberties;
      if (S.step.check === 'territory' || S.step.check === 'owner') S.owner = score(S.state).owner;
      S.marks = [];
      complete(S.step.right);
    } else {
      button.classList.add('wrong');
      button.disabled = true;
      miss(S.step.wrong || (S.step.check === 'liberties' ? '다시 세어 볼까요? 힌트를 누르면 활로를 보여 줘요.' : '다시 생각해 볼까요?'));
    }
  }

  // 상대가 받는 수를 조금 뒤에 둔다
  function later(fn) {
    S.busy = true;
    S.marks = [];
    draw();
    timer = setTimeout(() => {
      timer = null;
      S.busy = false;
      fn();
    }, 520);
  }

  function onTap(idx) {
    const step = S.step;
    const { state } = S;
    const size = state.size;

    if (step.type === 'explore') {
      if (state.board[idx] === EMPTY) return say('돌을 눌러 보세요.');
      const g = groupAt(state.board, size, idx);
      S.libs = g.liberties;
      S.seen.add(Math.min(...g.stones));
      const left = step.need - S.seen.size;
      if (left <= 0 && !S.done) complete(step.right);
      else if (!S.done) say('이 돌의 활로는 ' + g.liberties.length + '개예요. 남은 돌 ' + left + '개도 눌러 보세요.');
      draw();
      return;
    }
    if (S.done || S.busy) return;

    if (step.type === 'free') {
      const r = play(state, idx);
      if (!r.ok) return say(REASON_TEXT[r.reason], 'warn');
      S.state = r.state;
      S.showLast = true;
      S.placed++;
      if (S.placed >= step.count) complete(step.right);
      else {
        say(colorName(state.turn) + '돌을 놓았어요. 이번에는 ' + colorName(r.state.turn) + ' 차례예요. (' + S.placed + ' / ' + step.count + ')');
        draw();
      }
      return;
    }

    if (step.type === 'move') {
      const r = play(state, idx);
      if (!r.ok) return say(REASON_TEXT[r.reason], 'warn');
      if (S.parsed.answers.includes(idx)) {
        S.state = r.state;
        S.showLast = true;
        S.marks = [];
        complete(step.right);
      } else {
        S.marks = [{ at: idx, shape: 'miss' }];
        miss(step.wrong);
        draw();
      }
      return;
    }

    if (step.type === 'forbidden') {
      if (!S.spots.includes(idx)) return say('표시한 자리에 두어 보세요.');
      const r = play(state, idx);
      if (!r.ok) {
        S.marks = [{ at: idx, shape: 'miss' }];
        complete(step.right);
      }
      return;
    }

    if (step.type === 'sequence') {
      if (idx !== S.line[S.pos]) return say('동그라미 자리에 두어 보세요.');
      S.state = play(state, idx).state;
      S.showLast = true;
      S.pos++;
      if (S.pos >= S.line.length) {
        S.marks = [];
        return complete(step.right);
      }
      say('상대가 받는 수를 기다려요.');
      later(() => {
        S.state = play(S.state, S.line[S.pos]).state;
        S.pos++;
        S.marks = guideMarks();
        say('이제 다음 동그라미 자리에 두어 보세요.');
        draw();
      });
      return;
    }

    if (step.type === 'chase') {
      if (state.board[idx] !== EMPTY) return say('빈 자리를 눌러 주세요.');
      const r = play(state, idx);
      if (!r.ok) return say(REASON_TEXT[r.reason], 'warn');
      if (!chaseMoveWins(state, S.target, idx)) {
        S.marks = [{ at: idx, shape: 'miss' }];
        miss(step.wrong);
        draw();
        return;
      }
      S.state = r.state;
      S.showLast = true;
      S.marks = [];
      if (S.state.board[S.target] === EMPTY) return complete(step.right);
      say('좋아요. 상대가 어떻게 받는지 볼까요?', 'ok');
      later(() => {
        const reply = chaseReply(S.state, S.target);
        if (reply >= 0) S.state = play(S.state, reply).state;
        else S.state = pass(S.state);
        say(reply >= 0 ? '상대가 받았어요. 계속 몰아 보세요.' : '상대가 달아날 곳이 없어요. 이제 따내 보세요.');
        draw();
      });
      return;
    }

    if (step.type === 'point') {
      const gi = S.groups.findIndex((g) => g.includes(idx));
      if (gi < 0) {
        S.marks = S.marks.filter((m) => m.shape !== 'miss').concat([{ at: idx, shape: 'miss' }]);
        miss(step.wrong);
        draw();
        return;
      }
      if (S.found.has(gi)) return;
      S.found.add(gi);
      const spots = state.board[idx] === EMPTY ? [idx] : S.groups[gi];
      S.marks = S.marks.filter((m) => m.shape !== 'miss' && m.shape !== 'ring').concat(spots.map((at) => ({ at, shape: 'found' })));
      const left = S.groups.length - S.found.size;
      if (step.need === 'one' || left === 0) complete(step.right);
      else {
        say('잘 찾았어요. ' + left + '군데 더 있어요.', 'ok');
        draw();
      }
    }
  }

  function onHint() {
    if (S.done || S.busy) return;
    const step = S.step;
    if (S.hintLevel < 2) hints++;
    S.hintLevel++;
    S.flag = true;
    if (step.type === 'count') {
      if (step.check === 'liberties') {
        S.libs = groupAt(S.state.board, S.parsed.size, S.parsed.targets[0]).liberties;
        say('초록 점이 활로예요. 하나씩 세어 보세요.');
      } else if (step.check === 'territory') {
        S.owner = score(S.state).owner;
        say('작은 네모가 집이에요. 검은 네모는 흑 집, 흰 네모는 백 집이에요.');
      } else say(step.wrong || '천천히 하나씩 세어 보세요.');
    } else if (step.type === 'move') {
      if (S.hintLevel === 1 && step.hint) say(step.hint);
      else {
        S.marks = S.parsed.answers.map((at) => ({ at, shape: 'ring' }));
        say('초록 동그라미 자리에 두어 보세요.');
      }
    } else if (step.type === 'chase') {
      if (S.hintLevel === 1 && step.hint) say(step.hint);
      else {
        S.marks = chaseWinningMoves(S.state, S.target).slice(0, 1).map((at) => ({ at, shape: 'ring' }));
        say('초록 동그라미 자리에 두어 보세요.');
      }
    } else if (step.type === 'point') {
      if (S.hintLevel === 1 && step.hint) say(step.hint);
      else {
        const rings = [];
        S.groups.forEach((g, gi) => { if (!S.found.has(gi)) for (const at of g) rings.push({ at, shape: 'ring' }); });
        S.marks = S.marks.filter((m) => m.shape === 'found').concat(rings);
        say('초록 동그라미가 있는 곳을 눌러 보세요.');
      }
    } else if (step.hint) {
      say(step.hint);
    }
    draw();
  }

  // 걸음을 떠날 때 복습 목록을 고친다. 틀렸거나 힌트를 보면 넣고, 한 번에 맞히면 뺀다.
  function recordStep() {
    if (!store.current() || S.step.type === 'explain') return;
    const key = lesson.review ? lesson.keys[i] : lesson.id + ':' + i;
    if (S.flag) store.addReview(key);
    else if (store.resolveReview(key) && lesson.review) cleared++;
  }

  function onNext() {
    if (!S.done) return;
    recordStep();
    i++;
    if (i >= total) return finish();
    startStep();
    $('stepText').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function finish() {
    if (lesson.review) return finishReview();
    const stars = starsFor(mistakes, hints);
    let nextBtn;
    if (lesson.quiz) {
      store.completeMission(lesson.id);
      nextBtn = '<a class="primary" href="#/">학습 지도로</a>';
    } else {
      store.completeLesson(lesson.id, stars);
      const idx = LESSONS.indexOf(lesson);
      const next = LESSONS[idx + 1] && LESSONS[idx + 1].unit === lesson.unit ? LESSONS[idx + 1] : null;
      const mission = missionOfUnit(lesson.unit);
      nextBtn = next
        ? '<a class="primary" href="#/lesson/' + next.id + '">다음: ' + next.no + '차시 ' + esc(next.title) + '</a>'
        : '<a class="primary" href="' + mission.route + '">미션: ' + esc(mission.title) + '</a>';
    }
    const praise = stars === 3 ? '한 번도 틀리지 않았어요' : stars === 2 ? '아주 잘했어요' : '끝까지 해냈어요';
    root.innerHTML =
      '<div class="lesson-view">' + barHtml(eyebrow, lesson.title) +
      '<div class="segs">' + '<i class="done"></i>'.repeat(total) + '</div>' +
      '<section class="glass finish"><span class="dol big cheer">' + dolSvg('cheer') + '</span>' + starsHtml(stars, 'big') +
      '<h2>' + (lesson.quiz ? '미션을 마쳤어요' : lesson.no + '차시를 마쳤어요') + '</h2><p class="praise">' + praise + '</p>' +
      '<p class="summary">' + esc(lesson.summary) + '</p>' +
      '<div class="finish-actions">' + nextBtn + (lesson.quiz ? '' : '<a class="ghost-btn" href="#/">학습 지도로</a>') +
      '<button type="button" class="text-btn" id="again">다시 하기</button></div></section></div>';
    $('again').addEventListener('click', () => viewLesson(lesson));
    window.scrollTo(0, 0);
  }

  function finishReview() {
    const left = store.reviewList().length;
    root.innerHTML =
      '<div class="lesson-view">' + barHtml(eyebrow, lesson.title) +
      '<div class="segs">' + '<i class="done"></i>'.repeat(total) + '</div>' +
      '<section class="glass finish"><span class="dol big cheer">' + dolSvg('cheer') + '</span>' +
      '<h2>복습을 마쳤어요</h2><p class="praise">' + total + '문제 가운데 ' + cleared + '문제를 한 번에 맞혔어요</p>' +
      '<p class="summary">' + (left ? '아직 ' + left + '문제가 남아 있어요. 내일 다시 풀어 봐도 좋아요.' : '틀린 문제를 모두 풀었어요. 복습 목록이 비었어요.') + '</p>' +
      '<div class="finish-actions"><a class="primary" href="#/">학습 지도로</a>' +
      (left ? '<button type="button" class="text-btn" id="again">남은 문제 다시 풀기</button>' : '') + '</div></section></div>';
    if (left) $('again').addEventListener('click', () => { const l = reviewLesson(); if (l) viewLesson(l); else go('#/'); });
    window.scrollTo(0, 0);
  }

  startStep();
}

// ---------------------------------------------------------------- 따내기 바둑 (1단원 미션)

function viewCapture() {
  const mission = MISSIONS[0];
  let mode = 'ai';
  let moves = [createGame(9)];
  let winner = EMPTY;
  let lastCaptured = [];
  let timer = null;

  root.innerHTML =
    barHtml('1단원 미션', '따내기 바둑') +
    '<div class="seg" role="group" aria-label="상대 고르기"><button type="button" data-mode="ai" aria-pressed="true">돌돌이와 두기</button><button type="button" data-mode="two" aria-pressed="false">둘이서 두기</button></div>' +
    '<section class="glass status"><div class="turn"><span id="turnStone" class="chip black"></span><strong id="turnText"></strong></div><span class="rule">한 점이라도 먼저 따내면 이겨요</span></section>' +
    '<div class="boardwrap"><svg class="board" id="board" role="img" aria-label="9줄 바둑판"></svg></div>' +
    '<div class="dock plain" id="dock" data-plain="1"><p class="msg" id="msg" role="status" aria-live="polite"></p>' +
    '<div class="controls"><button type="button" id="undo">무르기</button><button type="button" id="reset">새 판</button></div></div>' +
    '<section class="glass result" id="result" hidden></section>';

  const view = createBoardView($('board'), onTap);
  const cur = () => moves[moves.length - 1];
  const thinking = () => timer !== null;
  leaveView = () => { if (timer) clearTimeout(timer); timer = null; };

  function draw() {
    const state = cur();
    view.draw({ state, atari: !winner, marks: lastCaptured.map((at) => ({ at, shape: 'ring' })), ghost: !winner && !thinking() });
    $('turnStone').className = 'chip ' + (state.turn === BLACK ? 'black' : 'white');
    const who = mode === 'ai' ? (state.turn === BLACK ? '내 차례 (흑)' : '돌돌이 차례 (백)') : colorName(state.turn) + ' 차례';
    $('turnText').textContent = winner ? '대국 끝' : who;
    $('undo').disabled = moves.length <= 1 || thinking();
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  }

  function showResult() {
    const box = $('result');
    if (!winner) {
      box.hidden = true;
      return;
    }
    const iWon = mode === 'two' || winner === BLACK;
    if (iWon && store.current()) store.completeMission(mission.id);
    const title = mode === 'ai' ? (winner === BLACK ? '이겼어요. 먼저 따냈어요' : '돌돌이가 먼저 따냈어요') : colorName(winner) + '이 먼저 따냈어요';
    const text = mode === 'ai'
      ? (winner === BLACK ? '상대 돌의 활로를 모두 막았어요. 미션을 마쳤어요.' : '내 돌이 단수(빨간 점선)인지 살피면서 다시 도전해 보세요.')
      : colorName(winner) + ' 승리. 한 판 더 두어 볼까요?';
    box.hidden = false;
    box.innerHTML = '<h2>' + title + '</h2><p>' + text + '</p><div class="finish-actions"><button type="button" class="primary" id="again">한 판 더</button><a class="ghost-btn" href="#/">학습 지도로</a></div>';
    $('again').addEventListener('click', newGame);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function apply(r, mover) {
    moves.push(r.state);
    lastCaptured = r.captured;
    if (r.captured.length > 0) {
      winner = mover;
      say(colorName(mover) + '이 ' + r.captured.length + '점을 따냈어요.', mode === 'ai' && mover === WHITE ? 'warn' : 'ok');
    }
  }

  function onTap(idx) {
    if (winner || thinking()) return;
    const state = cur();
    if (state.board[idx] !== EMPTY) return say('빈 자리를 눌러 주세요.');
    const r = play(state, idx);
    if (!r.ok) return say(REASON_TEXT[r.reason], 'warn');
    apply(r, state.turn);
    if (!winner) {
      const danger = groupsInAtari(r.state);
      const mineInDanger = danger.some((g) => g.color === state.turn);
      const foeInDanger = danger.some((g) => g.color === r.state.turn);
      say(mineInDanger
        ? '조심해요. ' + (mode === 'ai' ? '내 돌' : colorName(state.turn) + '돌') + '이 단수예요.'
        : foeInDanger ? '단수. ' + colorName(r.state.turn) + '돌의 활로가 하나 남았어요.' : '', mineInDanger ? 'warn' : '');
      if (mode === 'ai') timer = setTimeout(aiMove, 550);
    }
    draw();
    showResult();
  }

  function aiMove() {
    timer = null;
    const state = cur();
    const m = chooseMove(state, { missCapture: 0.2, missEscape: 0.45 });
    if (m < 0) {
      moves.push(pass(state));
      say('돌돌이가 둘 곳이 없어서 한 수 쉬었어요.');
    } else {
      const r = play(state, m);
      apply(r, state.turn);
      if (!winner) {
        const mine = groupsInAtari(r.state).some((g) => g.color === BLACK);
        say(mine ? '조심해요. 내 돌이 단수예요. 빨간 점선을 살펴보세요.' : '돌돌이가 두었어요. 내 차례예요.', mine ? 'warn' : '');
      }
    }
    draw();
    showResult();
  }

  function newGame() {
    if (timer) clearTimeout(timer);
    timer = null;
    moves = [createGame(9)];
    winner = EMPTY;
    lastCaptured = [];
    say(mode === 'ai' ? '내가 흑이에요. 먼저 두어 보세요.' : '흑부터 번갈아 두어요.');
    draw();
    showResult();
  }

  $('undo').addEventListener('click', () => {
    if (moves.length <= 1 || thinking()) return;
    moves.pop();
    if (mode === 'ai') while (moves.length > 1 && cur().turn !== BLACK) moves.pop();
    winner = EMPTY;
    lastCaptured = [];
    say('물렀어요.');
    draw();
    showResult();
  });
  $('reset').addEventListener('click', newGame);
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.mode === mode) return;
    if (cur().moveNumber > 0 && !winner && !confirm('지금 두던 판을 지우고 새로 시작할까요?')) return;
    mode = b.dataset.mode;
    newGame();
  }));

  newGame();
}

function viewCount() {
  const mission = missionOfUnit(2);
  const parsed = parseBoard({ rows: COUNT_BOARD.rows, komi: COUNT_BOARD.komi });
  const state = parsed.state;
  const expected = new Set(parsed.targets);
  const dead = new Set();
  let finished = false;
  let hinted = false;

  root.innerHTML =
    barHtml('2단원 미션', '집 세기') +
    '<div class="bubble"><span class="dol">' + dolSvg('smile') + '</span><p>대국이 끝난 판이에요. 상대 집 안에 갇혀서 살 수 없는 돌(죽은 돌)을 눌러서 골라내 보세요. 다 골랐으면 집 세기를 눌러요.</p></div>' +
    '<div class="boardwrap"><svg class="board" id="board" role="img" aria-label="끝난 9줄 판"></svg></div>' +
    '<section class="glass result" id="result"></section>' +
    '<div class="dock" id="dock"><p class="msg" id="msg" role="status" aria-live="polite"></p>' +
    '<div class="actions"><button type="button" id="hintBtn" class="ghost-btn">힌트</button><button type="button" id="doneBtn" class="primary">집 세기</button></div></div>';

  const view = createBoardView($('board'), (idx) => {
    if (finished) return;
    if (!toggleDead(dead, state, idx)) return say('돌을 눌러 주세요.');
    hinted = false;
    draw();
    say(dead.size ? '가위표가 붙은 돌은 죽은 돌로 세요. 다시 누르면 취소돼요.' : '');
  });

  function draw() {
    const result = score(state, [...dead]);
    const rings = hinted ? [...expected].filter((at) => !dead.has(at)).map((at) => ({ at, shape: 'ring' })) : [];
    view.draw({ state, owner: result.owner, marks: deadMarks(dead).concat(rings), showLast: false });
    $('result').innerHTML = '<h2>' + (finished ? '결과' : '지금까지 센 집') + '</h2>' + scoreTable(result) +
      (finished ? '<div class="finish-actions"><a class="primary" href="#/">학습 지도로</a></div>' : '<p class="note">작은 네모가 집이에요. 죽은 돌을 골라내면 집이 늘어나요.</p>');
  }

  $('hintBtn').addEventListener('click', () => {
    hinted = true;
    draw();
    say('초록 동그라미가 있는 돌을 살펴보세요. 둘레가 모두 상대 돌이에요.');
  });
  $('doneBtn').addEventListener('click', () => {
    const same = dead.size === expected.size && [...expected].every((at) => dead.has(at));
    if (!same) {
      return say(dead.size < expected.size
        ? '아직 죽은 돌이 남아 있어요. 상대 집 안에 홀로 있는 돌을 찾아보세요.'
        : '살아 있는 돌을 고른 것 같아요. 집을 둘러싼 돌은 살아 있는 돌이에요.', 'warn');
    }
    finished = true;
    if (store.current()) store.completeMission(mission.id);
    $('hintBtn').hidden = true;
    $('doneBtn').hidden = true;
    draw();
    say('맞게 세었어요. 죽은 돌은 따낸 돌에 더하고, 그 자리는 집이 돼요.', 'ok');
    $('result').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  draw();
}
